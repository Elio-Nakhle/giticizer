[project]
name = "giticizer"
version = "0.1.0"
description = "CodeMaat-inspired behavioral code analysis in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.12.0",
    "ty>=0.0.1a16",
]

[project.scripts]
giticizer = "giticizer.cli:run"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
